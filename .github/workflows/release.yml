name: release

on:
  push:
    tags: ["v*"]

# The workflow creates a release, uploads to it, and publishes the container
# image. Nothing else.
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags and full history, so release notes can be generated from the
          # log rather than from a hand-maintained file that drifts.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test before publishing
        run: go test ./...

      - name: build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          bare="${VERSION#v}"

          # CGO_ENABLED=0 is what makes these static, which is only possible
          # because D4 chose the pure-Go SQLite driver. That one decision is
          # why a single artifact runs on a laptop, in a scratch container, and
          # inside a Mac app.
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "building $goos/$goarch"

            # -trimpath keeps absolute build paths out of the binary, so the
            # same source produces the same bytes regardless of where it was
            # built.
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/je" ./cmd/je

            # The archive contains just `je`, at the top level. The installer
            # and `je upgrade` both extract by base name, and this is the name
            # they look for.
            tar -czf "dist/je_${bare}_${goos}_${goarch}.tar.gz" -C dist je
            rm dist/je
          done

      - name: checksums
        run: |
          cd dist
          # Refusing to install without this is the installer's default, so it
          # is not optional here.
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: verify the artifacts install
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          bare="${VERSION#v}"
          # Smoke test the artifact we are about to publish, rather than
          # finding out from the first person who downloads it.
          tar -xzf "dist/je_${bare}_linux_amd64.tar.gz" -C /tmp
          reported="$(/tmp/je version | head -n 1)"
          echo "$reported"
          case "$reported" in
            *"$VERSION"*) ;;
            *) echo "binary reports '$reported', expected it to contain $VERSION"; exit 1 ;;
          esac

      # The image is D20's other half. `je control-plane install --docker`
      # resolves this tag, so a release whose binaries exist and whose image
      # does not would leave that command pointing at nothing.
      #
      # Published before the GitHub release is created, deliberately: if the
      # image fails, there is no release at all rather than a release that is
      # half true.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: verify the image runs
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          # Built for this runner and loaded locally, so the smoke test runs
          # the actual image rather than trusting that it would have worked.
          docker buildx build \
            --platform linux/amd64 \
            --build-arg "VERSION=$VERSION" \
            --load -t je:smoke .

          reported="$(docker run --rm je:smoke version | head -n 1)"
          echo "$reported"
          case "$reported" in
            *"$VERSION"*) ;;
            *) echo "image reports '$reported', expected $VERSION"; exit 1 ;;
          esac

          # It must be able to be a worker as well as a control plane: one
          # image, two components (D20), and a CMD that only ever ran one of
          # them would break `je worker join --docker` and nothing else.
          docker run --rm je:smoke worker 2>&1 | grep -q "usage: je worker" \
            || { echo "the image cannot run the worker subcommand"; exit 1; }

      - name: publish the image
        env:
          VERSION: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -eu
          # arm64 is not optional: a Mac and a Raspberry Pi are both plausible
          # hosts, and an amd64-only image fails on them at `docker run` with a
          # message about exec formats that explains nothing.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$VERSION" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            --push .

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
