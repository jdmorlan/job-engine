# The control plane and its system worker, together (D20/C12).
#
# One command brings up both, because two components that must both be running
# is a worse first five minutes than one -- and C11 means a control plane on its
# own runs nothing at all. `docker compose up -d` is the whole of D19's stage
# "dev", and the image here is the same one that runs in a cluster.

name: job-engine

services:
  control-plane:
    build: .
    image: job-engine:dev
    # --tls-host names how OTHER containers reach this one. A wildcard bind has
    # no name of its own, and the service name is not something the process can
    # discover -- so it is told (D25). There is no --tls beside it any more: a
    # control plane serves HTTPS and there is no other way to run one.
    command: ["control-plane", "run", "--addr", "0.0.0.0:7620", "--tls-host", "control-plane"]
    ports:
      # Published on loopback only. The trust boundary moved from the process
      # to the network (D19's rider on N1), and binding 0.0.0.0 on your laptop
      # would move it further than anybody asked.
      - "127.0.0.1:7620:7620"
    environment:
      # D9/D19: containers default to UTC and schedules mean local time to a
      # human. This is the "why did my 3am job run at 8pm" bug, set explicitly
      # so it cannot happen.
      TZ: ${TZ:-UTC}
    volumes:
      # A named volume, never a bind mount. SQLite on a macOS bind mount goes
      # through VirtioFS/gRPC-FUSE, which has the same class of locking
      # pathology D19 warns about for NFS -- silent, and weeks out.
      - je-data:/var/lib/je
      # Definitions are read-only and safe to bind: no SQLite involved, and
      # editing job YAML on the host is the point (P3).
      - ./jobs:/var/lib/je/jobs:ro
      # What a worker needs to enroll itself: the token, and the authority to
      # verify this control plane with (D25). Its own volume rather than sharing
      # the data one, because the databases and the secret store live there and
      # a worker has no business reading either.
      - je-bootstrap:/var/lib/je/bootstrap
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/je", "status"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  worker:
    build: .
    image: job-engine:dev
    # Only the control plane holds state, so the worker needs no volume at all
    # (C2). Losing this container costs its in-flight runs and nothing else.
    command: ["worker", "run", "--addr", "control-plane:7620", "--name", "system", "--labels", "default"]
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      # It enrolls itself from here on every start, and writes its identity to
      # the container's own layer -- which it may lose freely, because
      # re-enrolling is free and C2 says a worker holds nothing worth keeping.
      - je-bootstrap:/var/lib/je/bootstrap:ro
      # The same definitions the control plane reads. A job from a *directory*
      # source runs only on a worker that can see that directory (D22), so a
      # worker without this can run nothing from ./jobs. A job from a repository
      # needs none of this: its tree travels to the worker (D25).
      - ./jobs:/var/lib/je/jobs:ro
    depends_on:
      control-plane:
        condition: service_started
    restart: unless-stopped

  # The web client (D23). A third component of the same image, holding no state
  # and owning no volume: it serves the embedded assets and proxies /v1 to the
  # control plane, so it is a client in exactly the way the CLI is.
  web:
    build: .
    image: job-engine:dev
    command: ["web", "run", "--addr", "0.0.0.0:7621", "--control-plane", "https://control-plane:7620"]
    volumes:
      # The authority only. The web client presents no certificate: it is not a
      # worker and has no identity to prove -- it just has to know it is talking
      # to the right control plane.
      - je-bootstrap:/var/lib/je/bootstrap:ro
    ports:
      - "127.0.0.1:7621:7621"
    depends_on:
      control-plane:
        condition: service_started
    restart: unless-stopped

volumes:
  je-data:
  je-bootstrap:
